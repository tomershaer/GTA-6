  background:linear-gradient(170deg,rgba(40,22,64,.97),rgba(12,8,22,.98));border:2px solid rgba(246,234,242,.18);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 6px #07040c;

@media (prefers-reduced-motion:no-preference){.launch-in{animation:launchIn 1.1s cubic-bezier(.2,1.4,.4,1) both}@keyframes launchIn{0%{transform:scale(.4);opacity:0;letter-spacing:.4em}60%{opacity:1}100%{transform:scale(1);letter-spacing:.02em}}}

<script>
/* ---------- countdown ---------- */
const TARGET = Date.UTC(2026,10,18,22,0,0);   // 19 Nov 00:00 Israel (UTC+2)
const LINK = 'https://tomershaer.github.io/GTA-6/?v=2';
const minEl=document.getElementById('min'), clockEl=document.getElementById('clock'), unitEl=document.getElementById('unit');
/* every line stands on its own; the number below always reads "N days to go" */
/* "Here we go again." is saved for the launch moment only */
const LINES=[
  '13 years since the last heist',
  'Respect +',
  '<s>5</s> 6 stars are waiting for you',
  'HESOYAM won\'t help you here',
  'Ammu-Nation is restocking',
  'From Liberty City, through Los Santos, to Leonida',

(function pickLine(){
  let i=0;

    const prev=localStorage.getItem('gta6-line');
    if(prev!==null&&LINES.length>1){do{i=Math.floor(Math.random()*LINES.length)}while(String(i)===prev)}

  }catch(e){i=Math.floor(Math.random()*LINES.length)}
  document.getElementById('label').innerHTML=LINES[i];
})();
/* preload strip: "get ready" lines until Nov 10, "it's open" lines after */
const PRELOAD=Date.UTC(2026,10,9,22,0,0), XBOX_PRELOAD=Date.UTC(2026,10,10,0,0,0);
const PRE_LINES=[
  'Roman wants to go bowling. Tell him you\'re busy clearing 212 GB',
  '212 GB. Size matters. Delete Warzone'
];
const LIVE_LINES=[
  'It\'s in. 212 GB of it',
  'Leave the PS5 on. Tell your mom it\'s important',
  'Don\'t touch the router. Don\'t even look at it'
];
function pickFrom(arr,key){let i=0;try{const prev=localStorage.getItem(key);if(prev!==null&&arr.length>1){do{i=Math.floor(Math.random()*arr.length)}while(String(i)===prev)}localStorage.setItem(key,String(i))}catch(e){i=Math.floor(Math.random()*arr.length)}return arr[i]}
const plEl=document.getElementById('preload');let plState=null;
function renderPreload(now){
  if(now>=TARGET){plEl.hidden=true;return}
  const live=now>=PRELOAD;
  if(live!==plState){plState=live;plEl.classList.toggle('live',live);
    /* never show "Here we go again" twice on one screen */
    const dup=document.getElementById('label').textContent.startsWith('Here we go again');
    const arr=(live?LIVE_LINES:PRE_LINES).filter(l=>!(dup&&l.startsWith('Here we go again'))), lineEl=document.getElementById('plLine');
    lineEl.textContent=arr.length?pickFrom(arr,live?'gta6-pl-live':'gta6-pl-pre'):'';lineEl.hidden=!arr.length}
  document.getElementById('plInfo').textContent=!live?'Preload opens Tue, Nov 10 · up to 212 GB'
    :'Preload live on PS5 · up to 212 GB';
}
const p2=n=>String(n).padStart(2,'0');
let last=null;
/* open the page with #launch-preview to see the launch moment now */
const isPreview=()=>location.hash==='#launch-preview';
addEventListener('hashchange',()=>{if(!isPreview())location.reload()});
let launched=false;
function render(){
  renderPreload(isPreview()?TARGET:Date.now());
  const diff=isPreview()?0:TARGET-Date.now();
  if(diff<=0){
    /* launch moment: only the line, nothing else */
    document.getElementById('app').classList.add('done');
    if(!launched){launched=true;document.getElementById('label').textContent='';
      minEl.hidden=true;unitEl.hidden=true;clockEl.hidden=true;document.querySelector('.target').hidden=true;setTimeout(startCall,400)}
    return;
  }
  const d=Math.floor(diff/864e5),h=Math.floor(diff%864e5/36e5),m=Math.floor(diff%36e5/6e4),s=Math.floor(diff%6e4/1000);
  /* big number: days until the last 48h, then hours, then minutes in the last hour, then seconds */
  let big,unit,clock;
  if(diff>=48*36e5){big=d;unit=d===1?'day':'days';clock=`${p2(h)}:${p2(m)}:${p2(s)}`}
  else if(diff>=36e5){big=Math.floor(diff/36e5);unit=big===1?'hour':'hours';clock=`${p2(m)}:${p2(s)}`}
  else if(diff>=6e4){big=Math.floor(diff/6e4);unit=big===1?'minute':'minutes';clock=`:${p2(s)}`}
  else{big=Math.floor(diff/1000);unit='seconds';clock=''}
  unitEl.textContent=unit+' to go';
  clockEl.textContent=clock;clockEl.hidden=!clock;
  if(big!==last){
    minEl.textContent=big.toLocaleString('en-US');
    minEl.classList.remove('tick');void minEl.offsetWidth;minEl.classList.add('tick');last=big;
  }

render();setInterval(render,250);
/* original launch sting: laid-back west-coast groove with a gliding synth lead (synthesised live, no samples) */
/* one audio context, unlocked by the viewer's tap on Answer/Decline, so the music can start later on cue */
let launchAC=null;
function getLaunchAC(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!launchAC)launchAC=new AC();if(launchAC.state==='suspended')launchAC.resume();return launchAC}catch(e){return null}}

  const bass=(t,n,len)=>{const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=hz(n);f.type='lowpass';f.frequency.value=380;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(f).connect(g).connect(out);o.start(t);o.stop(t+len+.05)};

/* ---------- launch night crew (shared list of PSN usernames, stored in Firebase) ---------- */
const $=id=>document.getElementById(id);
const DB='https://gta-6-countdown-bd613-default-rtdb.europe-west1.firebasedatabase.app';
const crew={me:null,docs:[],started:false,timer:null};
try{crew.me=localStorage.getItem('gta6-crew-me')}catch(e){}
const PSN_RE=/^[A-Za-z][A-Za-z0-9_-]{2,15}$/;
function crewMsg(t){$('crewMsg').textContent=t}
function renderCrew(){
  const list=$('crewList');list.textContent='';
  $('crewCount').textContent=crew.docs.length?'· '+crew.docs.length:'';
  if(!crew.docs.length){const li=document.createElement('li');li.className='empty';li.textContent='Nobody yet. Be the first.';list.append(li)}
  crew.docs.forEach(d=>{
    const mine=d.id===crew.me,li=document.createElement('li');
    const n=document.createElement('span');n.className='psn';n.textContent=String(d.psn||'');li.append(n);
    if(mine){const t=document.createElement('em');t.textContent='you';li.append(t)}
    list.append(li);
  });
  /* once you're on the list the form steps aside (names can't be edited without accounts) */
  $('crewForm').hidden=!!crew.docs.find(d=>d.id===crew.me);
}
async function loadCrew(){
  const r=await fetch(DB+'/crew.json',{cache:'no-store'});
  if(!r.ok)throw new Error(r.status);
  const v=(await r.json())||{};
  crew.docs=Object.entries(v).map(([id,d])=>({id,psn:d&&d.psn,at:(d&&d.at)||0})).sort((a,b)=>a.at-b.at);
  renderCrew();
}
async function refreshCrew(){
  try{await loadCrew();const t=$('crewMsg').textContent;if(t.startsWith('Loading')||t.startsWith('The list is slow')||t.startsWith('The crew list could not'))crewMsg('')}
  catch(e){crewMsg('The crew list could not load right now.')}
}
function startCrew(){
  if(crew.started)return;crew.started=true;
  crewMsg('Loading the crew…');
  const slow=setTimeout(()=>{if($('crewMsg').textContent.startsWith('Loading'))crewMsg('The list is slow to load. It will show up when it is ready.')},10000);
  refreshCrew().finally(()=>clearTimeout(slow));

  cx.strokeStyle='rgba(255,220,190,.25)';cx.lineWidth=1;for(let i=0;i<10;i++){const y=hz+6+i*i*3;if(y>H)break;cx.beginPath();for(let x=0;x<=W;x+=14)cx.lineTo(x,y+Math.sin(x*.04+t*1.5+i)*1.2);cx.stroke()}
  for(let i=0;i<10;i++){const w=R*1.8*(1-i/12)*(.8+.2*Math.sin(t*2+i));cx.fillStyle=`rgba(255,240,190,${.5-i*.04})`;cx.fillRect(sx-w/2,hz+3+i*7,w,2)}
  const tree=(x,base,h,ph)=>{cx.fillStyle='#120818';cx.fillRect(x-3,base-h,6,h);cx.beginPath();cx.moveTo(x-12,base);cx.lineTo(x,base-h*.25);cx.lineTo(x+12,base);cx.fill();
    for(let i=0;i<4;i++){cx.beginPath();cx.ellipse(x+Math.sin(i*2+ph)*6,base-h+i*h*.14,Math.min(W*.12,h*(.07+i*.03)),h*.045,0,0,7);cx.fill()}
    cx.strokeStyle='rgba(18,8,24,.8)';cx.lineWidth=1.2;
    for(let i=0;i<6;i++){const mx=x-h*.15+i*h*.06,my=base-h*.8+(i%3)*h*.12,sw=reduce?0:Math.sin(t*1.2+i+ph)*2;cx.beginPath();cx.moveTo(mx,my);cx.quadraticCurveTo(mx+sw,my+h*.08,mx+sw*.5,my+h*.16);cx.stroke()}};
  tree(W*.06,H*.86,H*.5,0);tree(W*.18,H*.84,H*.36,1);tree(W*.92,H*.87,H*.46,2);tree(W*.83,H*.83,H*.3,3);
  cx.fillStyle='#0e0614';cx.beginPath();cx.moveTo(0,H);cx.lineTo(0,H*.88);cx.quadraticCurveTo(W*.3,H*.84,W*.5,H*.9);cx.quadraticCurveTo(W*.75,H*.95,W,H*.86);cx.lineTo(W,H);cx.fill();
  this.fl.forEach(f=>{const base=H*.8,s=f.s*Math.min(1.3,H/650),bob=reduce?0:Math.sin(t*1.3+f.ph)*3;

      cx.beginPath();cx.moveTo(0,0);cx.lineTo(0,-38);cx.stroke();cx.beginPath();cx.moveTo(0,-30);cx.lineTo(-6,-36);cx.lineTo(0,-38);cx.stroke();
      cx.beginPath();cx.ellipse(0,-46,13,8,-.2,0,7);cx.fill();
      cx.lineWidth=3;cx.beginPath();cx.moveTo(8,-50);cx.quadraticCurveTo(20,-60,10,-70+bob);cx.quadraticCurveTo(4,-80+bob,12,-84+bob);cx.stroke();

    bird(1,1);bird(-1,.25)});
  const gx=((t*12)%(W+200))-100,gy=H*.83;cx.fillStyle='#0e0614';cx.beginPath();cx.ellipse(gx,gy,40,4,0,Math.PI,0);cx.fill();cx.beginPath();cx.ellipse(gx+30,gy-2,6,4,0,0,7);cx.fill();
  cx.fillStyle=`rgba(255,220,120,${.6+.4*Math.sin(t*2)})`;cx.fillRect(gx+27,gy-5,2,2);cx.fillRect(gx+33,gy-5,2,2);
  this.motes.forEach(([x,y,k])=>{cx.fillStyle=`rgba(255,240,180,${.3+.3*Math.sin(t*3+k*40)})`;cx.fillRect(x+Math.sin(t+k*9)*6,y-((t*8*k)%60),2,2)});
 }}
];

/* ---------- scene rotation ---------- */
let si=0;
try{
  const prev=localStorage.getItem('gta6-scene');
  do{si=Math.floor(Math.random()*SCENES.length)}while(prev!==null&&String(si)===prev);
  localStorage.setItem('gta6-scene',String(si));
}catch(e){si=Math.floor(Math.random()*SCENES.length)}
function setup(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
  SCENES.forEach(s=>s.init());
}
function paint(ms){cx.clearRect(0,0,W,H);SCENES[si].draw(ms/1000)}
function showScene(){if(reduce)paint(0)}
document.getElementById('nextScene').addEventListener('click',()=>{
  si=(si+1)%SCENES.length;try{localStorage.setItem('gta6-scene',String(si))}catch(e){}showScene();
});
addEventListener('resize',()=>{setup();if(reduce)paint(0)});
setup();showScene();
if(!reduce){const loop=ms=>{paint(ms);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
</script>
